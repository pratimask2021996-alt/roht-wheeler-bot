{% extends "base.html" %}

{% block title %}Page Not Found | Obstacle Avoiding Bot.MIS{% endblock %}

{% block content %}
<section class="section error-section">
    <div class="container">
        <div class="error-content reveal">
            <h1>404</h1>
            <h2>Signal Lost — Obstacle Detected On This Route</h2>
            <p>The page you're looking for doesn't exist or may have been moved.</p>
            <a href="{{ url_for('home') }}" class="btn btn-primary">Return To Base</a>
        </div>
    </div>
</section>
{% endblock %}
